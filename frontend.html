<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Um pedido para Lara</title>
  <style>
    :root { --rose: #e84d78; --rose-dark: #b92858; --ink: #542336; --soft-ink: #8f5d70; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; overflow: hidden; color: var(--ink); background: radial-gradient(circle at 15% 18%, rgba(255,255,255,.95) 0 2px, transparent 3px), radial-gradient(circle at 85% 75%, rgba(255,255,255,.8) 0 3px, transparent 4px), linear-gradient(135deg, #ffe7ee 0%, #fff8f4 48%, #ffdce7 100%); font-family: Georgia, 'Times New Roman', serif; }
    .scene { position: relative; display: grid; min-height: 100vh; place-items: center; padding: 24px; isolation: isolate; }
    .scene::before, .scene::after { content: '♥'; position: absolute; z-index: -1; color: rgba(232,77,120,.15); font-size: clamp(150px,25vw,310px); line-height: 1; animation: float 7s ease-in-out infinite; }
    .scene::before { top: 6%; left: 5%; transform: rotate(-18deg); }
    .scene::after { right: 7%; bottom: 2%; animation-delay: -3s; transform: rotate(18deg); }
    .hearts { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .heart { position: absolute; bottom: -40px; color: rgba(232,77,120,.35); font-size: var(--size); animation: rise var(--duration) linear infinite; animation-delay: var(--delay); }
    .card { width: min(100%, 650px); padding: clamp(34px,7vw,76px) clamp(24px,8vw,84px); border: 1px solid rgba(255,255,255,.85); border-radius: 28px; background: rgba(255,255,255,.66); box-shadow: 0 24px 80px rgba(163,51,89,.2), inset 0 1px 0 #fff; text-align: center; backdrop-filter: blur(14px); animation: appear .9s cubic-bezier(.22,1,.36,1) both; }
    .kicker { margin: 0 0 18px; color: var(--rose-dark); font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font-size: clamp(44px,9vw,82px); line-height: .98; letter-spacing: -2px; }
    .subtitle { margin: 24px auto 0; color: var(--soft-ink); font-size: clamp(17px,2.8vw,21px); line-height: 1.5; }
    .actions { position: relative; display: flex; min-height: 118px; align-items: center; justify-content: center; gap: 14px; margin-top: 30px; }
    button { border: 0; border-radius: 999px; cursor: pointer; font: 700 16px Arial, sans-serif; transition: transform .2s ease, box-shadow .2s ease; }
    button:focus-visible { outline: 3px solid rgba(84,35,54,.45); outline-offset: 4px; }
    .yes { padding: 16px 29px; color: #fff; background: linear-gradient(135deg, var(--rose), var(--rose-dark)); box-shadow: 0 10px 22px rgba(185,40,88,.28); }
    .yes:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 14px 26px rgba(185,40,88,.35); }
    .no { position: relative; padding: 14px 25px; color: var(--rose-dark); background: rgba(255,255,255,.78); box-shadow: 0 7px 18px rgba(163,51,89,.12); }
    .no.is-moving { position: fixed; z-index: 3; transition: left .24s ease, top .24s ease; }
    .answer { min-height: 27px; margin: 20px 0 0; color: var(--rose-dark); font-size: 20px; font-weight: 700; }
    .signature { margin: 18px 0 0; color: rgba(143,93,112,.72); font-size: 14px; }
    @keyframes appear { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes rise { from { transform: translateY(0) rotate(0deg); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-115vh) rotate(28deg); opacity: 0; } }
    @keyframes float { 0%,100% { translate: 0 0; } 50% { translate: 0 -18px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 430px) { .card { border-radius: 22px; } .actions { min-height: 150px; } .actions .yes { align-self: flex-start; } }
  </style>
</head>
<body>
  <main class="scene">
    <div class="hearts" aria-hidden="true"></div>
    <section class="card" aria-labelledby="question">
      <p class="kicker">Uma pergunta importante</p>
      <h1 id="question">libera o xicotinho amor?</h1>
      <p class="subtitle">Lara, eu prometo dividir a vida, os sonhos, a pizza e o melhor de mim. Então, bora casar e me deixar ser seu xicotinho para sempre? ♥</p>
      <div class="actions">
        <button class="yes" id="yes" type="button">Sim! ♥</button>
        <button class="no" id="no" type="button">Não</button>
      </div>
      <p class="answer" id="answer" role="status" aria-live="polite"></p>
      <p class="signature">Com amor, para sempre nós dois.</p>
    </section>
  </main>
  <script>
    const hearts = document.querySelector('.hearts');
    const noButton = document.querySelector('#no');
    const yesButton = document.querySelector('#yes');
    const answer = document.querySelector('#answer');

    for (let index = 0; index < 18; index += 1) {
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = '♥';
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.setProperty('--size', `${14 + Math.random() * 24}px`);
      heart.style.setProperty('--duration', `${7 + Math.random() * 8}s`);
      heart.style.setProperty('--delay', `${Math.random() * -14}s`);
      hearts.appendChild(heart);
    }

    function moveNoButton() {
      const margin = 12;
      const maxX = Math.max(margin, window.innerWidth - noButton.offsetWidth - margin);
      const maxY = Math.max(margin, window.innerHeight - noButton.offsetHeight - margin);
      noButton.classList.add('is-moving');
      noButton.style.left = `${margin + Math.random() * (maxX - margin)}px`;
      noButton.style.top = `${margin + Math.random() * (maxY - margin)}px`;
      answer.textContent = 'Esse botão parece estar tímido...';
    }

    noButton.addEventListener('click', moveNoButton);
    yesButton.addEventListener('click', () => {
      answer.textContent = 'Aeee, liberou o xicotinho! ♥ Te amo, Lara!';
      yesButton.textContent = 'Siiiiim! ♥';
      noButton.hidden = true;
    });
  </script>
</body>
</html>
